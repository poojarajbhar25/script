<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="larna 1.css">
</head>
<body>
      <div class="container">
        <h1>Rock Paper Scissors</h1>
        <div class="choices">
            <img src="https://www.clipartmax.com/png/middle/428-4288882_rock-paper-scissor-icon-png.png"
                 alt="Rock"
                 class="choice"
                 data-choice="rock">

            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20210705223645/paper.jpeg"
                 alt="Paper"
                 class="choice"
                 data-choice="paper">

            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20210705223721/scissor.jpeg"
                 alt="Scissors"
                 class="choice"
                 data-choice="scissors">

        </div>

        <h2 id="playerChoice">Your Choice :</h2>
        <h2 id="computerChoice">Computer Choice :</h2>
        <h2 id="result">Result :</h2>

    </div>

    <audio id="rockSound" src="roeck1.wav"></audio>

    <audio id="paperSound" src="roeck.wav"></audio>

    <audio id="scissorsSound" src="scissore.wav"></audio>

    <script src="larna 1.js"></script>

</body>
</html>
